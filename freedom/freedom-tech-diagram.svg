<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="ft-title ft-desc">
  <title id="ft-title">poidh as Freedom Tech: Incentive &amp; Proof Coordination vs. Popularity Signals</title>
  <desc id="ft-desc">Original diagram comparing zero-cost social media popularity signals against poidh's five-stage ephemeral DAO coordination loop (Form, Fund, Prove, Adjudicate, Dissolve) and mapping what immutable smart contracts guarantee versus where human judgment remains.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D1322"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bgGrad)"/>
  <rect width="1200" height="780" fill="url(#grid)"/>

  <!-- Header Banner -->
  <rect x="36" y="24" width="1128" height="74" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="36" y="24" width="8" height="74" rx="4" fill="url(#accentBlue)"/>
  <text x="62" y="54" fill="#F8FAFC" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="0.3">
    FROM UNPRICED WISHES TO EPHEMERAL COVENANTS: HOW POIDH COORDINATES ACTION
  </text>
  <text x="62" y="79" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    Internet lowers Search Cost  ·  AI lowers Execution Cost  ·  poidh lowers Escrow &amp; Settlement Cost  |  Base #1485 · Disclosed AI Agent (QWE Poidh)
  </text>

  <!-- Section 1: Contrast Row (Popularity Signal vs Coordinated Funding) -->
  <!-- Left Card: Social Feed Popularity -->
  <rect x="36" y="114" width="548" height="148" rx="12" fill="#131B2E" stroke="#334155" stroke-width="1.2"/>
  <text x="58" y="142" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="1">
    A. TRADITIONAL SOCIAL FEED (MARKETPLACE OF IDEAS)
  </text>
  <text x="58" y="168" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="17" font-weight="700">
    Zero-Cost Popularity Signal: "Someone should fix this!"
  </text>
  <!-- Flow boxes -->
  <rect x="58" y="184" width="132" height="58" rx="8" fill="#0F172A" stroke="#475569"/>
  <text x="124" y="208" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Viral Complaint</text>
  <text x="124" y="226" text-anchor="middle" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">0 ETH staked</text>

  <line x1="190" y1="213" x2="224" y2="213" stroke="#64748B" stroke-width="2"/>

  <rect x="224" y="184" width="152" height="58" rx="8" fill="#0F172A" stroke="#475569"/>
  <text x="300" y="208" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">500 Likes &amp; Reposts</text>
  <text x="300" y="226" text-anchor="middle" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">Attention without skin</text>

  <line x1="376" y1="213" x2="410" y2="213" stroke="#64748B" stroke-width="2"/>

  <rect x="410" y="184" width="152" height="58" rx="8" fill="#1E1B2E" stroke="#F43F5E" stroke-dasharray="4 3"/>
  <text x="486" y="208" text-anchor="middle" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Unpriced Demand</text>
  <text x="486" y="226" text-anchor="middle" fill="#FB7185" font-family="ui-monospace, monospace" font-size="11">No escrow · Outcome optional</text>

  <!-- Right Card: poidh Coordinated Funding -->
  <rect x="616" y="114" width="548" height="148" rx="12" fill="#111C2D" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="638" y="142" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="1">
    B. POIDH PROTOCOL (MARKETPLACE FOR OUTCOMES)
  </text>
  <text x="638" y="168" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="17" font-weight="700">
    Priced Commitment: Escrowed Stake + Verifiable Proof
  </text>
  <rect x="638" y="184" width="144" height="58" rx="8" fill="#0B1325" stroke="#38BDF8"/>
  <text x="710" y="208" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Funded Intention</text>
  <text x="710" y="226" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">Locked in PoidhV3</text>

  <line x1="782" y1="213" x2="812" y2="213" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="812" y="184" width="154" height="58" rx="8" fill="#0B1325" stroke="#38BDF8"/>
  <text x="889" y="208" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Coordinated Pool</text>
  <text x="889" y="226" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">Stake = Vote Weight</text>

  <line x1="966" y1="213" x2="996" y2="213" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="996" y="184" width="146" height="58" rx="8" fill="#062825" stroke="#10B981"/>
  <text x="1069" y="208" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Verified Outcome</text>
  <text x="1069" y="226" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="11">97.5% Pull Payout</text>

  <!-- Section 2: The 5-Stage Ephemeral DAO Lifecycle -->
  <rect x="36" y="278" width="1128" height="232" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="58" y="306" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">
    THE EPHEMERAL DAO LIFECYCLE ON POIDHV3 (FORM → FUND → PROVE → ADJUDICATE → DISSOLVE)
  </text>

  <!-- Step 1 -->
  <rect x="56" y="324" width="196" height="140" rx="10" fill="#162033" stroke="#38BDF8" stroke-width="1.4"/>
  <circle cx="80" cy="348" r="12" fill="#38BDF8"/>
  <text x="80" y="353" text-anchor="middle" fill="#0B0F19" font-family="ui-monospace, monospace" font-size="13" font-weight="800">1</text>
  <text x="100" y="353" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">FORM</text>
  <text x="68" y="378" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Define clear outcome</text>
  <text x="68" y="395" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">&amp; evidence criteria.</text>
  <text x="68" y="422" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">createSoloBounty()</text>
  <text x="68" y="438" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">createOpenBounty()</text>
  <text x="68" y="454" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">Locks initial ETH</text>

  <line x1="252" y1="394" x2="278" y2="394" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 2 -->
  <rect x="278" y="324" width="196" height="140" rx="10" fill="#162033" stroke="#38BDF8" stroke-width="1.4"/>
  <circle cx="302" cy="348" r="12" fill="#38BDF8"/>
  <text x="302" y="353" text-anchor="middle" fill="#0B0F19" font-family="ui-monospace, monospace" font-size="13" font-weight="800">2</text>
  <text x="322" y="353" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">FUND</text>
  <text x="290" y="378" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Strangers pool ETH;</text>
  <text x="290" y="395" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">gain proportional vote.</text>
  <text x="290" y="422" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">joinOpenBounty()</text>
  <text x="290" y="438" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">Exit while no vote:</text>
  <text x="290" y="454" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">withdrawFromOpenBounty()</text>

  <line x1="474" y1="394" x2="500" y2="394" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 3 -->
  <rect x="500" y="324" width="196" height="140" rx="10" fill="#162033" stroke="#38BDF8" stroke-width="1.4"/>
  <circle cx="524" cy="348" r="12" fill="#38BDF8"/>
  <text x="524" y="353" text-anchor="middle" fill="#0B0F19" font-family="ui-monospace, monospace" font-size="13" font-weight="800">3</text>
  <text x="544" y="353" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">PROVE</text>
  <text x="512" y="378" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Human or AI agent</text>
  <text x="512" y="395" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">delivers work + proof.</text>
  <text x="512" y="422" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">createClaim(id, ...)</text>
  <text x="512" y="438" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">No KYC / No gatekeeper</text>
  <text x="512" y="454" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">Claim NFT escrowed</text>

  <line x1="696" y1="394" x2="722" y2="394" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Step 4 (Human Judgment Highlighted) -->
  <rect x="722" y="324" width="204" height="140" rx="10" fill="#231B12" stroke="#F59E0B" stroke-width="1.8"/>
  <circle cx="746" cy="348" r="12" fill="#F59E0B"/>
  <text x="746" y="353" text-anchor="middle" fill="#0B0F19" font-family="ui-monospace, monospace" font-size="13" font-weight="800">4</text>
  <text x="766" y="353" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="15" font-weight="700">ADJUDICATE</text>
  <text x="734" y="378" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="12">Issuer nominates; open</text>
  <text x="734" y="395" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="12">funders vote 48h window.</text>
  <text x="734" y="422" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11">submitClaimForVote()</text>
  <text x="734" y="438" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11">voteClaim() / resolveVote()</text>
  <text x="734" y="454" fill="#F59E0B" font-family="ui-monospace, monospace" font-size="10">HUMAN TRUST BOUNDARY</text>

  <line x1="926" y1="394" x2="952" y2="394" stroke="#10B981" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 5 -->
  <rect x="952" y="324" width="192" height="140" rx="10" fill="#0A2622" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="976" cy="348" r="12" fill="#10B981"/>
  <text x="976" y="353" text-anchor="middle" fill="#0B0F19" font-family="ui-monospace, monospace" font-size="13" font-weight="800">5</text>
  <text x="996" y="353" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="15" font-weight="700">DISSOLVE</text>
  <text x="964" y="378" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">97.5% to claimant,</text>
  <text x="964" y="395" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">2.5% fee, NFT to issuer.</text>
  <text x="964" y="422" fill="#34D399" font-family="ui-monospace, monospace" font-size="11">withdraw() [Pull-Pay]</text>
  <text x="964" y="438" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10">Zero ongoing DAO bloat</text>
  <text x="964" y="454" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10">Failed vote → reset; exit separately</text>

  <!-- Return loop for No Vote / Refund -->
  <path d="M 824 464 L 824 492 L 376 492 L 376 464" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="600" y="486" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11">
    After a failed vote: reset; issuer may nominate again; contributors may withdraw when no vote is active
  </text>

  <!-- Section 3: The Honest Trust Boundary (What Code Enforces vs What Humans Judge) -->
  <rect x="36" y="528" width="548" height="224" rx="12" fill="#0D211F" stroke="#10B981" stroke-width="1.5"/>
  <text x="58" y="556" fill="#34D399" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">
    MECHANICAL GUARANTEES (ENFORCED BY POIDHV3 CODE)
  </text>
  <text x="58" y="582" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">
    What Smart Contract Escrow Eliminates: Custody &amp; Gatekeeping
  </text>
  <text x="58" y="610" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="13.5">
    • Permissionless Entry: Any wallet (human or AI agent) can fund or claim without KYC.
  </text>
  <text x="58" y="634" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="13.5">
    • Non-Custodial Escrow: No admin key, no pause(), no upgrade proxy, fixed 2.5% fee.
  </text>
  <text x="58" y="658" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="13.5">
    • Pull-Payment Safety: ReentrancyGuard + individual pendingWithdrawals balances.
  </text>
  <text x="58" y="682" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="13.5">
    • Exit Rights: Open-bounty funders can withdraw whenever no 48h vote is active.
  </text>
  <text x="58" y="706" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="13.5">
    • Ephemeral Lifespan: Governance exists strictly for the task, then dissolves cleanly.
  </text>
  <text x="58" y="734" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="11">
    Verified Base v3: 0x5555FA783936c260F77385B4e153b9725Fef1719
  </text>

  <rect x="616" y="528" width="548" height="224" rx="12" fill="#231915" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="638" y="556" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">
    IRREDUCIBLE HUMAN JUDGMENT (NOT SOLVED BY ESCROW OR AI)
  </text>
  <text x="638" y="582" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">
    What Requires Discernment: Adjudication &amp; Off-Chain Truth
  </text>
  <text x="638" y="610" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13.5">
    • Solo Bounty Discretion: The issuer alone decides whether to accept a claim or cancel.
  </text>
  <text x="638" y="634" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13.5">
    • Nomination Bottleneck: In open bounties, the issuer chooses which claim goes to vote.
  </text>
  <text x="638" y="658" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13.5">
    • Proof Fabrication Risk: Staged photos, cherry-picked links, or AI-generated artifacts
  </text>
  <text x="638" y="682" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13.5">
      can fool voters (as seen in poidh's own $1,200 Gaza olive-tree post-mortem).
  </text>
  <text x="638" y="706" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13.5">
    • Freedom Tech ≠ Zero Trust: It removes platform rent-seekers so participants own the judgment.
  </text>
  <text x="638" y="734" fill="#F59E0B" font-family="ui-monospace, monospace" font-size="11">
    "Pics or it didn't happen" starts the verification — humans &amp; stake finish it.
  </text>
</svg>
